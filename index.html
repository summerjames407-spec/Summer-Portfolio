<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jordan Alexis — Modeling Portfolio</title>
  <meta name="description" content="Modeling portfolio and comp card." />

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ HERO ============ -->
  <header class="hero">
    <div class="hero__photo-frame">
      <img id="hero-photo" src="" alt="" />
    </div>
    <p class="eyebrow" id="hero-location"></p>
    <h1 id="hero-name"></h1>
    <p class="hero__tagline" id="hero-tagline"></p>

    <a href="#about" class="scroll-cue" aria-label="Scroll down">
      Scroll
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 4v16M6 14l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </header>

  <!-- ============ ABOUT / STATS ============ -->
  <section id="about">
    <div class="container">
      <div class="section-header">
        <p class="eyebrow">About</p>
        <h2>Statistics</h2>
        <hr class="divider" />
      </div>
      <p class="about__intro" id="about-intro"></p>
      <div class="stats-grid" id="stats-grid"></div>
    </div>
  </section>

  <!-- ============ GALLERY ============ -->
  <section id="gallery">
    <div class="container">
      <div class="section-header">
        <p class="eyebrow">Portfolio</p>
        <h2>Gallery</h2>
        <hr class="divider" />
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <!-- ============ EXPERIENCE ============ -->
  <section id="experience">
    <div class="container">
      <div class="section-header">
        <p class="eyebrow">Resume</p>
        <h2>Experience</h2>
        <hr class="divider" />
      </div>
      <div id="experience-content"></div>
    </div>
  </section>

  <!-- ============ CONTACT ============ -->
  <section id="contact">
    <div class="container">
      <div class="section-header">
        <p class="eyebrow">Get in touch</p>
        <h2>Contact</h2>
        <hr class="divider" />
      </div>

      <!-- Netlify reads these attributes when the site deploys and starts
           catching submissions automatically. "form-name" must match the
           form's name. "bot-field" is an invisible trap: real people never
           see it, so anything that fills it in is a spam bot. -->
      <form
        class="contact-form"
        id="contact-form"
        name="contact"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="contact" />
        <p class="hidden-field">
          <label>Leave this empty: <input name="bot-field" /></label>
        </p>
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell me about the opportunity..." required></textarea>
        </div>
        <button type="submit" id="contact-submit">Send Message</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>

      <div class="contact-direct">
        <a id="contact-email" href=""></a>
        <a id="contact-phone" href=""></a>
        <div class="social-icons" id="social-icons"></div>
      </div>
    </div>
  </section>

  <!-- ============ LIGHTBOX ============ -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" id="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <!-- ============ FOOTER ============ -->
  <footer>
    <div class="footer-qr" id="footer-qr"></div>
    <p class="footer-note">Scan to open this site on your phone.</p>
    <p id="footer-copyright"></p>
  </footer>

  <!-- QR code library, bundled into this site so it never depends on an
       outside server being reachable. -->
  <script src="js/vendor/qrcode.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
